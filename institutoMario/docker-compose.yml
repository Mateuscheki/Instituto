services:
  # Sem serviço de banco aqui — o Postgres é o Supabase remoto (mesmo projeto
  # em dev e produção). Ver README.md, seção "Configurando o Supabase", para
  # criar o projeto e obter a connection string que preenche as variáveis
  # SPRING_DATASOURCE_* abaixo (via .env — veja .env.example).
  app:
    build: .
    container_name: img-springboot-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads

volumes:
  uploads_data:
