spring.application.name=institutoMario

server.port=8080

# Banco: PostgreSQL no Supabase — nunca MySQL local, nem em dev (local e
# produção sempre contra o mesmo projeto remoto, pra não ter schema/migration
# dessincronizado entre ambientes). As três variáveis abaixo vêm do ambiente
# (ver .env.example e README.md, seção "Configurando o Supabase"); sem elas
# definidas a aplicação falha ao subir, em vez de tentar conectar em algum
# lugar errado.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Módulo Benefícios: migrations versionadas (Flyway).
# baseline-on-migrate=true porque o schema já existente (tabelas legadas,
# criadas via ddl-auto=update) não tem histórico de migration nenhum — o
# Flyway assume esse estado atual como "linha de base" e só aplica migrations
# com versão maior que baseline-version, em vez de tentar recriar tudo do zero.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=/app/uploads_container

api.security.token.secret=minha-chave-secreta-super-longa-e-segura-para-gerar-tokens-jwt

