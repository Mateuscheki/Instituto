<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8">
    <title>Histórico de retiradas</title>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content" id="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-primary d-block d-lg-none me-3" id="menu-open-toggle">
            <i class="bi bi-list"></i>
        </button>
        <h1 class="beneficios-titulo-secao h4 m-0">Histórico de retiradas</h1>
        <a th:href="@{/beneficios/retiradas/registrar}" class="btn btn-beneficios-primario">
            <i class="bi bi-basket2-fill"></i> Registrar retirada
        </a>
    </div>

    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <!-- Filtros -->
    <div class="beneficios-card card mb-3">
        <div class="card-body">
            <form th:action="@{/beneficios/retiradas}" method="get" class="row g-2">
                <div class="col-md-2">
                    <label class="form-label campo-label">Mês</label>
                    <input type="month" name="mes" class="form-control" th:value="${filtro.mes}">
                </div>
                <div class="col-md-2">
                    <label class="form-label campo-label">De</label>
                    <input type="date" name="dataInicio" class="form-control" th:value="${filtro.dataInicio}">
                </div>
                <div class="col-md-2">
                    <label class="form-label campo-label">Até</label>
                    <input type="date" name="dataFim" class="form-control" th:value="${filtro.dataFim}">
                </div>
                <div class="col-md-2">
                    <label class="form-label campo-label">CPF do beneficiário</label>
                    <input type="text" name="cpf" class="form-control mascara-cpf" th:value="${filtro.cpf}">
                </div>
                <div class="col-md-2">
                    <label class="form-label campo-label">Tipo de retirante</label>
                    <select name="tipoRetirante" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="opcao : ${tiposRetirante}" th:value="${opcao.key}" th:text="${opcao.value}"
                                th:selected="${opcao.key == filtro.tipoRetirante}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label campo-label">Padrinho/madrinha</label>
                    <select name="padrinhoId" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="padrinho : ${padrinhos}" th:value="${padrinho.id}" th:text="${padrinho.nome}"
                                th:selected="${padrinho.id == filtro.padrinhoId}"></option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label campo-label">Quem entregou</label>
                    <select name="voluntarioId" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="voluntario : ${voluntarios}" th:value="${voluntario.id}" th:text="${voluntario.nome}"
                                th:selected="${voluntario.id == filtro.voluntarioId}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label campo-label">Cidade</label>
                    <input type="text" name="cidade" class="form-control" th:value="${filtro.cidade}">
                </div>
                <div class="col-md-2">
                    <label class="form-label campo-label">Bairro</label>
                    <input type="text" name="bairro" class="form-control" th:value="${filtro.bairro}">
                </div>
                <div class="col-md-2 d-flex align-items-center">
                    <div class="form-check mt-3">
                        <input class="form-check-input" type="checkbox" name="incluirCanceladas" value="true" id="incluirCanceladas" th:checked="${filtro.incluirCanceladas}">
                        <label class="form-check-label" for="incluirCanceladas">Incluir canceladas</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-beneficios-primario w-100"><i class="bi bi-search"></i> Filtrar</button>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <a th:href="@{/beneficios/retiradas}" class="btn btn-beneficios-secundario w-100">
                        <i class="bi bi-x-circle"></i> Limpar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header">
            <tr>
                <th>Data</th>
                <th>Mês</th>
                <th>Beneficiário</th>
                <th>Retirante</th>
                <th>Padrinho?</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${pagina.content}" th:classappend="${item.cancelada} ? 'table-secondary'">
                <td th:text="${#temporals.format(item.dataRetirada, 'dd/MM/yyyy HH:mm')}">—</td>
                <td th:text="${#temporals.format(item.mesReferencia, 'MM/yyyy')}">—</td>
                <td th:text="${item.beneficiarioNome}">—</td>
                <td th:text="${item.retiranteNome} + ' (' + ${item.tipoRetirante.descricao} + ')'">—</td>
                <td th:text="${item.retiradoPorPadrinho} ? (item.padrinhoNome ?: 'Sim') : 'Não'">—</td>
                <td>
                    <span class="badge" th:classappend="${item.cancelada} ? 'bg-secondary' : 'bg-success'"
                          th:text="${item.cancelada} ? 'Cancelada' : 'Válida'"></span>
                </td>
                <td>
                    <a th:href="@{/beneficios/retiradas/{id}(id=${item.id})}" class="btn btn-sm btn-beneficios-primario" title="Detalhe">
                        <i class="bi bi-eye-fill"></i>
                    </a>
                    <a th:href="@{/beneficios/retiradas/{id}/comprovante(id=${item.id})}" class="btn btn-sm btn-beneficios-secundario" title="Comprovante">
                        <i class="bi bi-printer-fill"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${pagina.content.isEmpty()}">
                <td colspan="7" class="text-center">Nenhuma retirada encontrada com os filtros informados.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${pagina.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/beneficios/retiradas(page=${pagina.number - 1}, mes=${filtro.mes}, dataInicio=${filtro.dataInicio}, dataFim=${filtro.dataFim}, cpf=${filtro.cpf}, tipoRetirante=${filtro.tipoRetirante}, padrinhoId=${filtro.padrinhoId}, voluntarioId=${filtro.voluntarioId}, cidade=${filtro.cidade}, bairro=${filtro.bairro}, incluirCanceladas=${filtro.incluirCanceladas})">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Página ' + ${pagina.number + 1} + ' de ' + ${pagina.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/beneficios/retiradas(page=${pagina.number + 1}, mes=${filtro.mes}, dataInicio=${filtro.dataInicio}, dataFim=${filtro.dataFim}, cpf=${filtro.cpf}, tipoRetirante=${filtro.tipoRetirante}, padrinhoId=${filtro.padrinhoId}, voluntarioId=${filtro.voluntarioId}, cidade=${filtro.cidade}, bairro=${filtro.bairro}, incluirCanceladas=${filtro.incluirCanceladas})">Próxima</a>
            </li>
        </ul>
    </nav>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
