<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8">
    <title>Erro</title>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content" id="main-content">
    <div class="beneficios-card card">
        <div class="card-body text-center py-5">
            <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size: 3rem;"></i>
            <h1 class="beneficios-titulo-secao h4 mt-3">Não foi possível concluir</h1>
            <p class="text-muted" th:text="${mensagemErro}">Ocorreu um erro inesperado.</p>
            <a th:href="@{/beneficios}" class="btn btn-beneficios-primario mt-2">
                <i class="bi bi-arrow-left"></i> Voltar para o início do módulo
            </a>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
