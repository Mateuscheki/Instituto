<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Histórico do beneficiário</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
        <button class="btn btn-primary d-block d-lg-none" id="menu-open-toggle"><i class="bi bi-list"></i></button>
        <a th:href="@{/beneficios/beneficiarios/{id}(id=${beneficiarioId})}" class="btn btn-beneficios-secundario ms-auto">
            <i class="bi bi-arrow-left"></i> Voltar à ficha
        </a>
    </div>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Linha do tempo — retiradas mês a mês</h1>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header"><tr><th>Mês</th><th>Situação</th><th>Tipo de retirante</th></tr></thead>
            <tbody>
            <tr th:each="item : ${linhaDoTempo}">
                <td th:text="${#temporals.format(item.mes, 'MM/yyyy')}">—</td>
                <td>
                    <span class="badge" th:classappend="${item.situacao == 'RETIROU'} ? 'bg-success' : (${item.situacao == 'CANCELADA'} ? 'bg-secondary' : 'bg-danger')"
                          th:text="${item.situacao == 'RETIROU'} ? 'Retirou' : (${item.situacao == 'CANCELADA'} ? 'Cancelada' : 'Não retirou')"></span>
                </td>
                <td th:text="${item.tipoRetirante != null ? item.tipoRetirante.descricao : '—'}">—</td>
            </tr>
            <tr th:if="${#lists.isEmpty(linhaDoTempo)}"><td colspan="3" class="text-center">Nenhum registro encontrado para o período.</td></tr>
            </tbody>
        </table>
    </div>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
