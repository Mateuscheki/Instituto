<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Retiradas por terceiros</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3 no-print" id="menu-open-toggle"><i class="bi bi-list"></i></button>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Retiradas por terceiros (controle interno)</h1>
    <p class="text-muted">Retiradas cujo retirante não é o próprio beneficiário — apenas válidas (canceladas não entram).</p>

    <div th:replace="~{fragments/filtroPeriodo :: filtroPeriodo('/beneficios/relatorios/retiradas-por-terceiros', ${filtro}, false, true, false, false, null, true)}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header"><tr><th>Tipo de retirante</th><th>Quantidade</th></tr></thead>
            <tbody>
            <tr th:each="item : ${dados}">
                <td th:text="${item.tipoRetirante.descricao}">—</td>
                <td th:text="${item.quantidade}">0</td>
            </tr>
            <tr th:if="${#lists.isEmpty(dados)}"><td colspan="2" class="text-center">Nenhum registro encontrado para o período.</td></tr>
            </tbody>
            <tfoot th:if="${!#lists.isEmpty(dados)}">
            <tr class="fw-bold"><td>Total</td><td th:text="${#aggregates.sum(dados.![quantidade])}">0</td></tr>
            </tfoot>
        </table>
    </div>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
