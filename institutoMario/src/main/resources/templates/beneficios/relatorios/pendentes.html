<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Pendentes do mês</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3 no-print" id="menu-open-toggle"><i class="bi bi-list"></i></button>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Pendentes de <span th:text="${mes}">mês</span></h1>

    <div class="beneficios-card card mb-3 no-print">
        <div class="card-body">
            <form th:action="@{/beneficios/relatorios/pendentes}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label campo-label">Mês</label>
                    <input type="month" name="mes" class="form-control" th:value="${mes}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-beneficios-primario w-100">Filtrar</button>
                </div>
                <div class="col-md-4 ms-auto d-flex gap-2 justify-content-end">
                    <a class="btn btn-beneficios-secundario btn-sm" th:href="@{/beneficios/relatorios/pendentes(mes=${mes},formato='csv')}"><i class="bi bi-filetype-csv"></i> CSV</a>
                    <a class="btn btn-beneficios-secundario btn-sm" th:href="@{/beneficios/relatorios/pendentes(mes=${mes},formato='xlsx')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                    <button type="button" class="btn btn-beneficios-secundario btn-sm" onclick="window.print()"><i class="bi bi-printer-fill"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header">
            <tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Bairro</th><th>Padrinho</th><th>Última retirada</th><th>Dias sem retirar</th><th>Ações</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${pagina.content}">
                <td th:text="${item.nome}">—</td>
                <td th:text="${#cpf.mascararConformePerfil(item.cpf)}">—</td>
                <td th:text="${item.telefone ?: '—'}">—</td>
                <td th:text="${item.bairro ?: '—'}">—</td>
                <td th:text="${item.padrinhoNome ?: '—'}">—</td>
                <td th:text="${item.ultimaRetirada != null ? #temporals.format(item.ultimaRetirada, 'MM/yyyy') : 'nunca'}">—</td>
                <td th:text="${item.diasSemRetirar}">0</td>
                <td>
                    <a th:href="@{/beneficios/beneficiarios/{id}(id=${item.beneficiarioId})}" class="btn btn-sm btn-beneficios-primario">
                        <i class="bi bi-person-lines-fill"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${pagina.content.isEmpty()}"><td colspan="8" class="text-center">Nenhum registro encontrado para o período.</td></tr>
            </tbody>
            <tfoot th:if="${!pagina.content.isEmpty()}">
            <tr class="fw-bold"><td colspan="7">Total de pendentes</td><td th:text="${pagina.totalElements}">0</td></tr>
            </tfoot>
        </table>
    </div>

    <nav th:if="${pagina.totalPages > 1}" class="no-print">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link" th:href="@{/beneficios/relatorios/pendentes(mes=${mes},pagina=${pagina.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="'Página ' + ${pagina.number + 1} + ' de ' + ${pagina.totalPages}"></span></li>
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link" th:href="@{/beneficios/relatorios/pendentes(mes=${mes},pagina=${pagina.number + 1})}">Próxima</a>
            </li>
        </ul>
    </nav>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
