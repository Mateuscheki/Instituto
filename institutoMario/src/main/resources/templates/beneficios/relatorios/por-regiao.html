<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Por região</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3 no-print" id="menu-open-toggle"><i class="bi bi-list"></i></button>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Distribuição geográfica</h1>

    <div class="beneficios-card card mb-3 no-print">
        <div class="card-body">
            <form th:action="@{/beneficios/relatorios/por-regiao}" method="get" class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label campo-label">Agrupar por</label>
                    <select name="agruparPor" class="form-select">
                        <option value="bairro" th:selected="${agruparPor == 'bairro'}">Bairro</option>
                        <option value="cidade" th:selected="${agruparPor == 'cidade'}">Cidade</option>
                        <option value="uf" th:selected="${agruparPor == 'uf'}">UF</option>
                    </select>
                </div>
                <div class="col-md-2"><label class="form-label campo-label">Mês inicial</label><input type="month" name="mesInicio" class="form-control" th:value="${filtro.mesInicio}"></div>
                <div class="col-md-2"><label class="form-label campo-label">Mês final</label><input type="month" name="mesFim" class="form-control" th:value="${filtro.mesFim}"></div>
                <div class="col-md-2"><button type="submit" class="btn btn-beneficios-primario w-100">Filtrar</button></div>
                <div class="col-md-4 d-flex gap-2 justify-content-end">
                    <a class="btn btn-beneficios-secundario btn-sm" th:href="@{/beneficios/relatorios/por-regiao(agruparPor=${agruparPor},mesInicio=${filtro.mesInicio},mesFim=${filtro.mesFim},formato='csv')}"><i class="bi bi-filetype-csv"></i> CSV</a>
                    <a class="btn btn-beneficios-secundario btn-sm" th:href="@{/beneficios/relatorios/por-regiao(agruparPor=${agruparPor},mesInicio=${filtro.mesInicio},mesFim=${filtro.mesFim},formato='xlsx')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header">
            <tr><th th:text="${#strings.capitalize(agruparPor)}">Região</th><th>Beneficiários</th><th>Retiradas</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${pagina.content}">
                <td th:text="${item.regiao}">—</td>
                <td th:text="${item.beneficiarios}">0</td>
                <td th:text="${item.retiradas}">0</td>
            </tr>
            <tr th:if="${pagina.content.isEmpty()}"><td colspan="3" class="text-center">Nenhum registro encontrado para o período.</td></tr>
            </tbody>
        </table>
    </div>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
