<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Por padrinho</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3 no-print" id="menu-open-toggle"><i class="bi bi-list"></i></button>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Retiradas por padrinho</h1>

    <div th:replace="~{fragments/filtroPeriodo :: filtroPeriodo('/beneficios/relatorios/por-padrinho', ${filtro}, false, true, false, false, null, true)}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header">
            <tr><th>Padrinho</th><th>Apadrinhados</th><th>Retiradas no período</th><th>Entregues pelo próprio</th><th>% adesão</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${pagina.content}">
                <td th:text="${item.nome}">—</td>
                <td th:text="${item.apadrinhados}">0</td>
                <td th:text="${item.retiradasPeriodo}">0</td>
                <td th:text="${item.retiradasPeloProprioPadrinho}">0</td>
                <td th:text="${item.taxaAdesao} + '%'">0%</td>
            </tr>
            <tr th:if="${pagina.content.isEmpty()}"><td colspan="5" class="text-center">Nenhum registro encontrado para o período.</td></tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${pagina.totalPages > 1}" class="no-print">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link" th:href="@{/beneficios/relatorios/por-padrinho(mesInicio=${filtro.mesInicio},mesFim=${filtro.mesFim},pagina=${pagina.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="'Página ' + ${pagina.number + 1} + ' de ' + ${pagina.totalPages}"></span></li>
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link" th:href="@{/beneficios/relatorios/por-padrinho(mesInicio=${filtro.mesInicio},mesFim=${filtro.mesFim},pagina=${pagina.number + 1})}">Próxima</a>
            </li>
        </ul>
    </nav>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
