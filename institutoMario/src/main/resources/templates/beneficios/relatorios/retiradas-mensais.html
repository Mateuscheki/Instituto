<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Retiradas mensais</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3 no-print" id="menu-open-toggle"><i class="bi bi-list"></i></button>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Retiradas mensais</h1>

    <div th:replace="~{fragments/filtroPeriodo :: filtroPeriodo('/beneficios/relatorios/retiradas-mensais', ${filtro}, false, true, false, false, null, true)}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header">
            <tr><th>Mês</th><th>Retiradas</th><th>Cestas</th><th>Beneficiários distintos</th><th>% adesão (aprox.)</th></tr>
            </thead>
            <tbody>
            <tr th:each="linha : ${dados}">
                <td th:text="${#temporals.format(linha.mes, 'MM/yyyy')}">—</td>
                <td th:text="${linha.retiradas}">0</td>
                <td th:text="${linha.cestas}">0</td>
                <td th:text="${linha.beneficiariosDistintos}">0</td>
                <td th:text="${linha.percentualAdesao} + '%'">0%</td>
            </tr>
            <tr th:if="${#lists.isEmpty(dados)}"><td colspan="5" class="text-center">Nenhum registro encontrado para o período.</td></tr>
            </tbody>
            <tfoot th:if="${!#lists.isEmpty(dados)}">
            <tr class="fw-bold">
                <td>Total</td>
                <td th:text="${#aggregates.sum(dados.![retiradas])}">0</td>
                <td th:text="${#aggregates.sum(dados.![cestas])}">0</td>
                <td colspan="2"></td>
            </tr>
            </tfoot>
        </table>
    </div>
    <p class="text-muted small">A % de adesão de meses passados é aproximada pelo total de beneficiários ativos hoje (não há uma "fotografia" histórica de quem estava apto em cada mês).</p>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
