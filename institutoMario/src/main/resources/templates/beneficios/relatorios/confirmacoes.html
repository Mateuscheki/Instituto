<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Confirmações</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3 no-print" id="menu-open-toggle"><i class="bi bi-list"></i></button>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Avisos confirmados (conformidade)</h1>

    <div class="beneficios-card card mb-3 no-print">
        <div class="card-body">
            <form th:action="@{/beneficios/relatorios/confirmacoes}" method="get" class="row g-2 align-items-end">
                <div class="col-md-2"><label class="form-label campo-label">De</label><input type="date" name="dataInicio" class="form-control" th:value="${filtro.dataInicio}"></div>
                <div class="col-md-2"><label class="form-label campo-label">Até</label><input type="date" name="dataFim" class="form-control" th:value="${filtro.dataFim}"></div>
                <div class="col-md-3"><label class="form-label campo-label">Código do aviso</label><input type="text" name="codigo" class="form-control" th:value="${filtro.codigo}" placeholder="Ex.: JA_RETIROU_NO_MES"></div>
                <div class="col-md-2"><button type="submit" class="btn btn-beneficios-primario w-100">Filtrar</button></div>
                <div class="col-md-3 d-flex gap-2 justify-content-end">
                    <a class="btn btn-beneficios-secundario btn-sm" th:href="@{/beneficios/relatorios/confirmacoes(dataInicio=${filtro.dataInicio},dataFim=${filtro.dataFim},codigo=${filtro.codigo},formato='csv')}"><i class="bi bi-filetype-csv"></i> CSV</a>
                    <a class="btn btn-beneficios-secundario btn-sm" th:href="@{/beneficios/relatorios/confirmacoes(dataInicio=${filtro.dataInicio},dataFim=${filtro.dataFim},codigo=${filtro.codigo},formato='xlsx')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header"><tr><th>Data/hora</th><th>Código</th><th>Severidade</th><th>Beneficiário</th><th>Confirmado por</th><th>Justificativa</th><th>Retirada</th></tr></thead>
            <tbody>
            <tr th:each="item : ${pagina.content}">
                <td th:text="${#temporals.format(item.confirmadoEm, 'dd/MM/yyyy HH:mm')}">—</td>
                <td th:text="${item.codigoAviso}">—</td>
                <td><span class="badge" th:classappend="${item.severidade.cssBadge}" th:text="${item.severidade}"></span></td>
                <td th:text="${item.beneficiarioNome ?: '—'}">—</td>
                <td th:text="${item.confirmadoPor}">—</td>
                <td th:text="${item.justificativa ?: '—'}">—</td>
                <td><a th:href="@{/beneficios/retiradas/{id}(id=${item.retiradaId})}" class="btn btn-sm btn-beneficios-secundario"><i class="bi bi-eye-fill"></i></a></td>
            </tr>
            <tr th:if="${pagina.content.isEmpty()}"><td colspan="7" class="text-center">Nenhum registro encontrado para o período.</td></tr>
            </tbody>
        </table>
    </div>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
