<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Voluntários (analítico)</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3 no-print" id="menu-open-toggle"><i class="bi bi-list"></i></button>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Voluntários (analítico)</h1>

    <div class="beneficios-card card mb-3 no-print">
        <div class="card-body">
            <form th:action="@{/beneficios/relatorios/voluntarios}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label campo-label">Ativo</label>
                    <select name="ativo" class="form-select">
                        <option value="">Todos</option>
                        <option value="true" th:selected="${filtro.ativo == true}">Sim</option>
                        <option value="false" th:selected="${filtro.ativo == false}">Não</option>
                    </select>
                </div>
                <div class="col-md-3"><label class="form-label campo-label">Área de atuação</label><input type="text" name="areaAtuacao" class="form-control" th:value="${filtro.areaAtuacao}"></div>
                <div class="col-md-2"><button type="submit" class="btn btn-beneficios-primario w-100">Filtrar</button></div>
                <div class="col-md-4 d-flex gap-2 justify-content-end">
                    <a class="btn btn-beneficios-secundario btn-sm" th:href="@{/beneficios/relatorios/voluntarios(ativo=${filtro.ativo},areaAtuacao=${filtro.areaAtuacao},formato='csv')}"><i class="bi bi-filetype-csv"></i> CSV</a>
                    <a class="btn btn-beneficios-secundario btn-sm" th:href="@{/beneficios/relatorios/voluntarios(ativo=${filtro.ativo},areaAtuacao=${filtro.areaAtuacao},formato='xlsx')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header"><tr><th>Nome</th><th>Área</th><th>Setor</th><th>Padrinho?</th><th>Ativo?</th><th>Entregas totais</th></tr></thead>
            <tbody>
            <tr th:each="item : ${pagina.content}">
                <td th:text="${item.nome}">—</td>
                <td th:text="${item.areaAtuacao ?: '—'}">—</td>
                <td th:text="${item.setor ?: '—'}">—</td>
                <td><span class="badge" th:classappend="${item.padrinho} ? 'bg-success' : 'bg-secondary'" th:text="${item.padrinho} ? 'Sim' : 'Não'"></span></td>
                <td><span class="badge" th:classappend="${item.ativo} ? 'bg-success' : 'bg-secondary'" th:text="${item.ativo} ? 'Sim' : 'Não'"></span></td>
                <td th:text="${item.entregasTotal}">0</td>
            </tr>
            <tr th:if="${pagina.content.isEmpty()}"><td colspan="6" class="text-center">Nenhum registro encontrado.</td></tr>
            </tbody>
        </table>
    </div>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
