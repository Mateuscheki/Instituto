<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8"><title>Por voluntário</title>
</head>
<body>
<div class="no-print" th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3 no-print" id="menu-open-toggle"><i class="bi bi-list"></i></button>
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <h1 class="beneficios-titulo-secao h4 mb-3">Entregas por voluntário</h1>

    <div th:replace="~{fragments/filtroPeriodo :: filtroPeriodo('/beneficios/relatorios/por-voluntario', ${filtro}, false, true, false, false, null, true)}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-header">
            <tr><th>Voluntário</th><th>Área de atuação</th><th>Setor</th><th>Entregas</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${pagina.content}">
                <td th:text="${item.nome}">—</td>
                <td th:text="${item.areaAtuacao ?: '—'}">—</td>
                <td th:text="${item.setor ?: '—'}">—</td>
                <td th:text="${item.entregas}">0</td>
            </tr>
            <tr th:if="${pagina.content.isEmpty()}"><td colspan="4" class="text-center">Nenhum registro encontrado para o período.</td></tr>
            </tbody>
            <tfoot th:if="${!pagina.content.isEmpty()}">
            <tr class="fw-bold"><td colspan="3">Total de entregas</td><td th:text="${#aggregates.sum(pagina.content.![entregas])}">0</td></tr>
            </tfoot>
        </table>
    </div>
</div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
