<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="index :: head">
    <meta charset="UTF-8">
    <title th:text="Hackathon - Lista de Presença"></title>
</head>
<body>

<div th:replace="index :: sidebar"></div>

<div class="main-content" id="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <button class="btn btn-primary d-block d-lg-none me-3" id="menu-open-toggle">
            <i class="bi bi-list"></i>
        </button>
        <h2 class="m-0">Lista de Presença</h2>
    </div>

    <div th:if="${param.sucesso}" class="alert alert-success" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        As presenças foram atualizadas e salvas com sucesso.
    </div>

    <div th:if="${mensagemInfo}" class="alert alert-info" role="alert" th:text="${mensagemInfo}">
    </div>

    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <strong>Chamada Nominal</strong>
            <span class="badge bg-primary"
                  th:text="${chamada.turma.nome} + ' - ' + ${#temporals.format(chamada.data, 'dd/MM/yyyy')}">
            </span>
        </div>

        <form th:action="@{/chamadas/{id}/presencas/salvar(id=${chamada.id})}" method="post">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-header">
                    <tr>
                        <th class="text-center" style="width: 15%;">Presença</th>
                        <th>Nome do Aluno</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="presenca : ${listaPresencas}">
                        <td class="text-center">
                            <input class="form-check-input" style="transform: scale(1.3); cursor: pointer;"
                                   type="checkbox"
                                   name="presencasPresentes"
                                   th:value="${presenca.id}"
                                   th:checked="${presenca.presente}">
                        </td>
                        <td th:text="${presenca.aluno.usuario.nome}">João da Silva</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaPresencas)}">
                        <td colspan="2" class="text-center">Nenhum aluno vinculado a esta turma.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer bg-white d-flex justify-content-end gap-2">
                <a th:href="@{/chamadas}" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-success"><i class="bi bi-save me-1"></i> Salvar Presenças</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/sidebar-toggle.js}"></script>
</body>
</html>
