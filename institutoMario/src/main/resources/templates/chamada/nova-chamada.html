<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="index :: head">
    <meta charset="UTF-8">
    <title th:text="Hackathon - Nova Chamada"></title>
</head>
<body>

<div th:replace="index :: sidebar"></div>

<div class="main-content" id="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <button class="btn btn-primary d-block d-lg-none me-3" id="menu-open-toggle">
            <i class="bi bi-list"></i>
        </button>
        <h2 class="m-0">Iniciar Nova Chamada</h2>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <p class="text-muted mb-4">Selecione a data e a turma para gerar a lista de alunos.</p>

            <form th:action="@{/chamadas/salvar}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="data" class="form-label">Data da Aula</label>
                    <input type="date" id="data" name="data" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="turmaId" class="form-label">Turma</label>
                    <select id="turmaId" name="turmaId" class="form-select" required>
                        <option value="">Selecione uma turma...</option>
                        <option th:each="turma : ${turmas}"
                                th:value="${turma.id}"
                                th:text="${turma.nome}">
                        </option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-success"><i class="bi bi-list-check me-1"></i> Gerar Lista de Alunos</button>
                    <a th:href="@{/chamadas}" class="btn btn-secondary ms-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/sidebar-toggle.js}"></script>
</body>
</html>
