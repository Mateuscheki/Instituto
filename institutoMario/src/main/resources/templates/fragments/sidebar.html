<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<body>
<!--
  Mesmo menu do restante do sistema (ver templates/index.html :: sidebar),
  com o item "Benefícios" adicionado e restrito a ADM. A view por trás da
  URL já é protegida pelo SecurityFilterChain (SecurityConfig,
  beneficiosSecurityChain) — o sec:authorize aqui é só para não OFERECER um
  link que o usuário não pode acessar, nunca a única barreira.
-->
<div class="sidebar" th:fragment="sidebar">

    <button class="sidebar-toggle" id="menu-close-toggle">
        <i class="bi bi-x-lg"></i>
    </button>

    <div class="text-center py-4">
        <img th:src="@{/images/logoMario.png}" alt="Instituto Mário Gazin" class="sidebar-logo">
    </div>

    <a th:href="@{/}"><i class="bi bi-house-door-fill"></i> Início</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}"><i class="bi bi-person-badge-fill"></i> Usuários</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/turmas}"><i class="bi bi-people-fill"></i> Turmas</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/projetos}"><i class="bi bi-folder-fill"></i> Projetos</a>
    <a th:href="@{/disciplinas}"><i class="bi bi-journal-bookmark-fill"></i> Disciplinas</a>
    <a sec:authorize="hasAnyRole('ADMIN', 'PROFESSOR')" th:href="@{/provas}"><i class="bi bi-journal"></i> Provas</a>
    <a sec:authorize="hasRole('ALUNO')" th:href="@{/provas/responder}"><i class="bi bi-pencil-square"></i> Responder Prova</a>
    <a sec:authorize="hasAnyRole('ALUNO', 'PROFESSOR')" th:href="@{/notas}"><i class="bi bi-card-checklist"></i> Notas</a>
    <a th:href="@{/eventos}"><i class="bi bi-calendar-event-fill"></i> Eventos</a>
    <a sec:authorize="hasAnyRole('ADMIN', 'PROFESSOR')" th:href="@{/chamadas}"><i class="bi bi-clipboard-check"></i> Chamadas</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/relatorios}"><i class="bi bi-file-earmark-bar-graph-fill"></i> Relatórios</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/logs-auditoria}"><i class="bi bi-shield-lock-fill"></i> Logs de Auditoria</a>
    <a sec:authorize="hasRole('ADM')" th:href="@{/beneficios}" class="ativo"><i class="bi bi-basket2-fill"></i> Benefícios</a>
    <a th:href="@{/logout}" class="logout">
        <i class="bi bi-box-arrow-right"></i> Sair
    </a>
</div>
</body>
</html>
