<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Relatório por Turma e Dia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <div class="mb-4">
        <h3 class="mb-0 text-secondary fw-bold">Relatório de Frequência Diária</h3>
    </div>

    <!-- Formulário de Filtro -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
            <form action="/relatorios/chamadas/turma" method="GET" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="turmaId" class="form-label fw-bold text-muted">Turma</label>
                    <select id="turmaId" name="turmaId" class="form-select form-select-lg" required>
                        <option value="">Selecione a turma...</option>
                        <option th:each="turma : ${turmas}" th:value="${turma.id}" th:text="${turma.nome}"></option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label for="data" class="form-label fw-bold text-muted">Data da Aula</label>
                    <input type="date" id="data" name="data" class="form-control form-control-lg" th:value="${dataFiltro}" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Buscar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de Resultados -->
    <div class="card shadow-sm border-0" th:if="${resultados != null}">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center p-3">
            <h5 class="mb-0 fw-normal">Resultados da Busca</h5>
            <div>
                <span class="badge bg-success fs-6 me-2" th:text="'Presentes: ' + ${totalPresentes}"></span>
                <span class="badge bg-danger fs-6" th:text="'Ausentes: ' + ${totalAusentes}"></span>
            </div>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-4 py-3 text-uppercase text-secondary" style="font-size: 0.85rem;">Nome do Aluno</th>
                    <th class="py-3 text-center text-uppercase text-secondary" style="width: 200px; font-size: 0.85rem;">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="presenca : ${resultados}">
                    <td class="ps-4 fw-medium text-dark" th:text="${presenca.aluno.usuario.nome}">Nome do Aluno</td>
                    <td class="text-center">
                        <span th:if="${presenca.presente}" class="badge bg-success bg-opacity-10 text-success border border-success px-3 py-2 rounded-pill">Presente</span>
                        <span th:unless="${presenca.presente}" class="badge bg-danger bg-opacity-10 text-danger border border-danger px-3 py-2 rounded-pill">Falta</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(resultados)}">
                    <td colspan="2" class="text-center py-5 text-muted">Nenhuma chamada registrada para esta turma na data selecionada.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
