<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(tituloPagina=${tituloPagina})}">
    <meta charset="UTF-8">
    <title>Confirmar voluntário</title>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content" id="main-content">
    <button class="btn btn-primary d-block d-lg-none mb-3" id="menu-open-toggle">
        <i class="bi bi-list"></i>
    </button>

    <span class="beneficios-badge-secao">CONFIRMAÇÃO NECESSÁRIA</span>
    <h1 class="beneficios-titulo-secao h4 mb-3">Confirmar cadastro de voluntário</h1>

    <div th:if="${erroConfirmacao}" class="alert alert-danger">
        <i class="bi bi-exclamation-octagon-fill me-2"></i>
        <span th:text="${erroConfirmacao}"></span>
    </div>

    <form th:action="@{/beneficios/voluntarios/confirmar}" method="post">
        <div th:replace="~{fragments/campos :: hiddensDoForm(campos=${camposOcultos})}"></div>

        <div class="beneficios-card card mb-3">
            <div class="card-header"><strong>Resumo</strong></div>
            <div class="card-body row row-cols-1 row-cols-md-3 g-2">
                <div><strong>Nome:</strong> <span th:text="${voluntarioForm.nome}">—</span></div>
                <div><strong>CPF:</strong> <span th:text="${voluntarioForm.cpf}">—</span></div>
                <div><strong>Telefone:</strong> <span th:text="${voluntarioForm.telefone ?: '—'}">—</span></div>
            </div>
        </div>

        <div class="beneficios-card card mb-3">
            <div class="card-header"><strong>Avisos de confirmação</strong></div>
            <div class="card-body">
                <div th:each="aviso : ${avisos}" class="alert alert-danger">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="avisosConfirmados"
                               th:value="${aviso.codigo}" th:id="'aviso_' + ${aviso.codigo}"
                               th:checked="${avisosJaConfirmados != null and #lists.contains(avisosJaConfirmados, aviso.codigo)}">
                        <label class="form-check-label" th:for="'aviso_' + ${aviso.codigo}">
                            <strong>Confirmo e autorizo:</strong> <span th:text="${aviso.mensagem}">Mensagem</span>
                        </label>
                    </div>
                </div>

                <div class="mb-2 mt-3" th:if="${exigeJustificativa}">
                    <label for="justificativa" class="form-label campo-label">Justificativa (obrigatória)</label>
                    <textarea id="justificativa" name="justificativa" class="form-control" rows="2"
                              th:text="${justificativaDigitada}"></textarea>
                </div>
            </div>
        </div>

        <button type="submit" formaction="/beneficios/voluntarios/voltar" class="btn btn-beneficios-secundario">
            <i class="bi bi-arrow-left"></i> Voltar e corrigir
        </button>
        <button type="submit" class="btn btn-beneficios-primario">
            <i class="bi bi-check-circle"></i> Confirmar e salvar
        </button>
    </form>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
