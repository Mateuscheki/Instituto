<!DOCTYPE html>
<!--
  Layout raiz do módulo Benefícios.

  Decisão de implementação: o restante do sistema já usa composição por
  fragmentos nativos do Thymeleaf (th:replace="index :: head" / "index ::
  sidebar", ver templates/index.html) em vez do dialeto de layout
  (thymeleaf-layout-dialect / layout:decorate). Para não introduzir uma
  dependência nova só para o módulo novo e manter os dois pedaços do sistema
  no mesmo idioma, este layout segue a MESMA técnica: cada página do módulo
  inclui os fragmentos que precisa (head, sidebar, alertas, paginação,
  campos) em vez de "estender" este arquivo por herança de fato.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(tituloPagina)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloPagina} + ' - Benefícios - Instituto Mário Gazin'">Benefícios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/beneficios.css}">
</head>
<body>

<!-- Fragmento de rodapé de scripts, incluído por todas as páginas do módulo -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/sidebar-toggle.js}"></script>
    <script th:src="@{/js/beneficios.js}"></script>
</th:block>

</body>
</html>
